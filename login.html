<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Sign In — Stackly</title><link rel="stylesheet" href="css/style.css"/><link rel="stylesheet" href="css/auth.css"/><script src="js/auth.js"></script></head><body>
<div class="auth-page"><a href="javascript:history.back()" class="btn-wms-outline back-btn-top">&larr; Go Back</a><div class="auth-card"><div class="auth-logo"><a href="index.html"><img src="images/logo-stackly.webp" alt="Stackly"/></a></div><h2 class="auth-title">Welcome Back</h2><p class="auth-subtitle">Sign in to access your music dashboard</p>
<div class="role-selector" id="roleSelector"><button class="role-option active" data-role="student" onclick="selectRole(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Student</button><button class="role-option" data-role="admin" onclick="selectRole(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Admin</button></div>
<form onsubmit="event.preventDefault();handleLogin()"><div class="form-group"><label>Email <span class="required">*</span></label><input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required/><div class="form-error"></div></div><div class="form-group"><label>Password <span class="required">*</span></label><div class="password-wrapper"><input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required minlength="6"/><button type="button" class="password-toggle" onclick="togglePassword(this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="form-error"></div></div><button type="submit" class="btn btn-warm" style="width:100%;justify-content:center;">Sign In</button></form>
<div class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></div></div></div>
<script>
function togglePassword(btn) {
  const input = btn.previousElementSibling;
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
}
let selectedRole='student';function selectRole(el){document.querySelectorAll('.role-option').forEach(o=>o.classList.remove('active'));el.classList.add('active');selectedRole=el.dataset.role;}function handleLogin(){const email=document.getElementById('loginEmail').value;const password=document.getElementById('loginPassword').value;const result=authLogin(email,password,selectedRole);if(result.success){window.location.href='dashboard.html';}}
</script>
</body></html>
